{% load static %}
<ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

    <a class="sidebar-brand d-flex align-items-center justify-content-center" href="{% url 'core:dashboard' %}">
        <div class="sidebar-brand-icon">
            <i class="fas fa-egg"></i>
        </div>
        <div class="sidebar-brand-text mx-3"
             style="font-size: 0.65rem; line-height: 1.25; letter-spacing: 0.04em; text-align: left;">
            Hatchery<br>Management System
        </div>
    </a>

    <hr class="sidebar-divider my-0">

    <li class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
        <a class="nav-link" href="{% url 'core:dashboard' %}">
            <i class="fas fa-fw fa-tachometer-alt"></i>
            <span>Dashboard</span></a>
    </li>

    <hr class="sidebar-divider">
    <div class="sidebar-heading">Inventory</div>

    <li class="nav-item {% if request.resolver_match.app_name == 'inventory' and 'batch' in request.resolver_match.url_name %}active{% endif %}">
        <a class="nav-link" href="{% url 'inventory:batch_list' %}">
            <i class="fas fa-fw fa-layer-group"></i>
            <span>Batches</span></a>
    </li>
    <li class="nav-item {% if request.resolver_match.app_name == 'inventory' and 'supplier' in request.resolver_match.url_name %}active{% endif %}">
        <a class="nav-link" href="{% url 'inventory:supplier_list' %}">
            <i class="fas fa-fw fa-truck"></i>
            <span>Suppliers</span></a>
    </li>
    <li class="nav-item {% if request.resolver_match.app_name == 'inventory' and 'expense' in request.resolver_match.url_name %}active{% endif %}">
        <a class="nav-link" href="{% url 'inventory:expense_list' %}">
            <i class="fas fa-fw fa-receipt"></i>
            <span>Expenses</span></a>
    </li>

    <hr class="sidebar-divider">
    <div class="sidebar-heading">Sales</div>

    <li class="nav-item {% if request.resolver_match.app_name == 'sales' and 'sale' in request.resolver_match.url_name and 'customer' not in request.resolver_match.url_name and 'adjustment' not in request.resolver_match.url_name %}active{% endif %}">
        <a class="nav-link" href="{% url 'sales:sale_list' %}">
            <i class="fas fa-fw fa-cash-register"></i>
            <span>Sales</span></a>
    </li>
    <li class="nav-item {% if request.resolver_match.app_name == 'sales' and 'customer' in request.resolver_match.url_name %}active{% endif %}">
        <a class="nav-link" href="{% url 'sales:customer_list' %}">
            <i class="fas fa-fw fa-users"></i>
            <span>Customers</span></a>
    </li>
    <li class="nav-item {% if request.resolver_match.app_name == 'sales' and 'adjustment' in request.resolver_match.url_name %}active{% endif %}">
        <a class="nav-link" href="{% url 'sales:adjustment_list' %}">
            <i class="fas fa-fw fa-sliders-h"></i>
            <span>Adjustments</span></a>
    </li>

    <hr class="sidebar-divider d-none d-md-block">

    <div class="text-center d-none d-md-inline">
        <button class="rounded-circle border-0" id="sidebarToggle"></button>
    </div>
</ul>
