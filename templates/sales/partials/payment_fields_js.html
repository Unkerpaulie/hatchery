<script>
// ── Payment modal toggle logic ─────────────────────────────────────────────
//
// Two modals share payment_fields.html but have different semantics:
//
// FINALIZE modal (is_update = 0):
//   Full payment:    user enters the full sale total — editable, max = total.
//   Partial payment: user enters less than the total — editable, max = total.
//   In both cases the entered amount becomes payment_received on the sale.
//
// UPDATE PAYMENT modal (is_update = 1):
//   Full payment:    user enters the new cumulative total received — editable,
//                    max = sale total. View overwrites payment_received with it.
//   Partial payment: user enters an ADDITIONAL payment — editable,
//                    max = outstanding balance. View ADDS it to payment_received.
//
// The hidden input .js-payment-mode ('full'|'partial') is submitted with the
// form so the view knows which arithmetic to apply.

function initPaymentModal($modal) {
    var $input    = $modal.find('.js-payment-received');
    var $toggle   = $modal.find('.js-partial-toggle');
    var $hint     = $modal.find('.js-amount-hint');
    var $modeInput = $modal.find('.js-payment-mode');

    var total    = parseFloat($input.data('total')    || '0');
    var balance  = parseFloat($input.data('balance')  || total);
    var isUpdate = $input.data('is-update') === 1 || $input.data('is-update') === '1';

    function applyState(isPartial) {
        if (isPartial) {
            // Partial mode — additive payment up to the outstanding balance.
            var cap = isUpdate ? balance : total;
            $input
                .val('')
                .attr('max', cap.toFixed(2))
                .prop('readonly', false);
            if (isUpdate) {
                $hint.text(
                    'Enter the additional amount received (up to the balance of $' +
                    balance.toFixed(2) + '). It will be ADDED to what is already paid.'
                );
            } else {
                $hint.text(
                    'Enter the partial amount received (up to $' + total.toFixed(2) + ').'
                );
            }
            if ($modeInput.length) $modeInput.val('partial');
        } else {
            // Full payment mode.
            if (isUpdate) {
                // User enters the NEW cumulative total received (replaces stored value).
                $input
                    .val(total.toFixed(2))
                    .attr('max', total.toFixed(2))
                    .prop('readonly', false);
                $hint.text(
                    'Enter the total amount received so far (max $' + total.toFixed(2) +
                    '). This replaces the currently recorded amount.'
                );
            } else {
                // Finalize: pre-fill full total, still editable.
                $input
                    .val(total.toFixed(2))
                    .attr('max', total.toFixed(2))
                    .prop('readonly', false);
                $hint.text('Full sale amount of $' + total.toFixed(2) + ' pre-filled. Edit if needed.');
            }
            if ($modeInput.length) $modeInput.val('full');
        }
    }

    // Wire toggle.
    $toggle.off('change.payment').on('change.payment', function () {
        applyState($(this).is(':checked'));
    });

    // Reset to full-payment state when modal opens.
    $toggle.prop('checked', false);
    applyState(false);
}

$(document).on('show.bs.modal', '.modal', function () {
    initPaymentModal($(this));
});
</script>
